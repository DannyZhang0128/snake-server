<!DOCTYPE html>
<html>
<body>
<script>
  const ws = new WebSocket("ws://localhost:9001");
  let myId = null, n = 0;
  ws.onopen = () => console.log("connected");
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "welcome") { myId = m.id; console.log("welcome", m); return; }
    if (++n % 20 === 0) {            // log once per second
      const me = m.snakes.find(s => s.id === myId);
      console.log(`bytes=${e.data.length} len=${me.len} head=${me.p[0]}`);
    }
  };
</script>
</body>
</html>
